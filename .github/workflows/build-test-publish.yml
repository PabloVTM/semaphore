name: build-test-publish

# Lints and tests the code, builds the server image and smoke tests it (SQLite,
# admin login, bundled tools), then publishes a multi-arch image to GHCR. A push
# to master publishes `latest`; pushing a date tag (e.g. 2026-11-10) publishes
# that version.

on:
  push:
    branches: [master]
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint web
        working-directory: web
        run: npx eslint .

      - name: Web unit tests
        working-directory: web
        run: npm run test:unit

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Go tests
        run: go test ./...

  image:
    name: Build and smoke test image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/server/Dockerfile
          load: true
          tags: semaphore:test
          # always rebuild from the latest base so apk upgrade picks up security fixes
          pull: true
          no-cache: true

      - name: Serves Semaphore with SQLite, the admin login and the PabloSystems theme
        run: |
          docker run -d --name semaphore-test -p 3000:3000 \
            -e SEMAPHORE_DB_DIALECT=sqlite \
            -e SEMAPHORE_ADMIN=admin \
            -e SEMAPHORE_ADMIN_PASSWORD=smoke-test \
            -e SEMAPHORE_ADMIN_NAME=Admin \
            -e SEMAPHORE_ADMIN_EMAIL=admin@localhost \
            semaphore:test
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/api/ping | grep -q pong && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/ping | grep -q pong

          # the admin can sign in and read their profile
          curl -sf -c "$RUNNER_TEMP/cookies" -H 'Content-Type: application/json' \
            -d '{"auth":"admin","password":"smoke-test"}' http://localhost:3000/api/auth/login
          curl -sf -b "$RUNNER_TEMP/cookies" http://localhost:3000/api/user | grep -q '"admin":true'

          # the web bundle carries the theme
          curl -sf -o "$RUNNER_TEMP/index.html" http://localhost:3000/
          for asset in $(grep -o 'assets/[^"]*\.js' "$RUNNER_TEMP/index.html"); do
            curl -sf "http://localhost:3000/$asset"
          done | grep -q 'pablo@systems'

          # the bundled tools run, and Alpine has no pending security updates
          docker exec semaphore-test ansible --version
          docker exec semaphore-test tofu version
          docker exec semaphore-test terraform version
          docker exec semaphore-test terragrunt --version
          test "$(docker exec semaphore-test apk list -u 2>/dev/null | wc -l)" -eq 0

      - name: Show container logs on failure
        if: failure()
        run: docker logs semaphore-test || true

      - name: Remove test container
        if: always()
        run: docker rm -f semaphore-test || true

  publish:
    name: Publish multi-arch image to GHCR
    needs: [test, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/semaphore
          tags: |
            # git tag 2026-11-10 -> image tag 2026-11-10
            type=ref,event=tag
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # always rebuild from the latest base so apk upgrade picks up security fixes
          pull: true
          no-cache: true
